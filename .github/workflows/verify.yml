name: Verify and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - run: npm run check:server
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run test:offline
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: web-and-browser-evidence
          path: |
            dist/
            artifacts/*.png
            artifacts/test-results/
            artifacts/offline-tests/
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Select runner JDK 21 and install SDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run build:android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-apk
          path: artifacts/packages/*.apk
          retention-days: 14

  ios:
    runs-on: macos-26
    # Four fresh devices plus packaging; per-action readiness stays at 60 s.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:ios:ordinary
      # Freeze the ordinary app that was actually tested, before diagnostic
      # suites replace the build products. A later gate failure stays a failure.
      - name: Verify tested ordinary archive
        run: test -s artifacts/packages/wendao-ios-simulator.zip
      - run: npm run test:ios:cold
      # Restore ordinary build products after the diagnostic suites.
      - run: npm run build:ios
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-simulator-app
          path: |
            artifacts/packages/*.zip
            artifacts/ios-native-*.xcresult/
            artifacts/ios-native-input-*.json
            artifacts/ios-cold-entry.json
            artifacts/ios-ordinary-*.xcresult/
            artifacts/ios-ordinary-entry.json
          retention-days: 14

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: rustup update stable --no-self-update
      - run: rustup default stable
      - run: npm ci
      - run: npm run build:desktop
      - run: npm run test:desktop
      - name: Verify ordinary macOS native first entry
        if: runner.os == 'macOS'
        run: npm run test:macos:ui
      - name: Match WebView2 driver and install our NSIS package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-driver.ps1
      - name: Verify installed Windows client
        if: runner.os == 'Windows'
        run: node scripts/windows-smoke.mjs
      - name: Build isolated Windows runtime audit
        if: runner.os == 'Windows'
        env:
          WENDAO_COACH_FIXTURE: '1'
        run: npm run build:desktop-audit
      - name: Verify native Windows audio, minimize and continuous frames
        if: runner.os == 'Windows'
        env:
          WENDAO_RUNTIME_AUDIT: '1'
          WENDAO_COACH_FIXTURE: '1'
          WENDAO_SOAK_CYCLES: '15'
        run: node scripts/windows-smoke.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            artifacts/windows-native/
            artifacts/windows-runtime/
            artifacts/macos-ci-ui/result.json
            artifacts/macos-ci-ui/runtime.json
            artifacts/macos-ui-*.xcresult/
          retention-days: 14
